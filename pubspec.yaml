name: anatomo
description: "Anatomo: explore the human body in 3D. Offline, private and open source."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  webview_flutter: ^4.13.0
  http: ^1.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/web/
    - assets/web/vendor/
    - assets/models/male/
    - assets/models/female/
    - assets/content/
